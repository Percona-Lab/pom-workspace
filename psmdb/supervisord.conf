; Process table for one PSMDB sandbox node.
;
; supervisord stands in for systemd, which is what makes an in-place package
; upgrade testable here: an upgrade payload runs `apt-get install
; percona-server-mongodb-server=<newer>` and then `supervisorctl restart mongo`,
; which is the container analogue of `systemctl restart mongod`. The Debian
; postinst never starts anything (policy-rc.d in the Dockerfile), so the package
; swap and the restart stay two separate, individually observable steps —
; exactly the seam a rolling-upgrade app needs to drive.
;
; The unix socket is left at its default so `supervisorctl` works over `docker
; exec` and, more to the point, from a Nomad allocation running on this node.

[program:mongo]
command=/srv/scripts/run-mongo.sh
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=60
; SIGTERM is mongod's clean shutdown; give it the full stopwaitsecs before
; supervisord escalates, or an upgrade restart can leave an unclean dbPath.
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pmm-agent]
command=/srv/scripts/run-pmm-agent.sh
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pbm-agent]
command=/srv/scripts/run-pbm-agent.sh
user=mongod
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; One-shot: rs.initiate + root user on the elected bootstrap member, sh.addShard
; on a mongos. A no-op everywhere else. Must precede register.sh in effect, which
; it does by construction — register.sh blocks until the root user works.
[program:cluster-init]
command=/srv/scripts/cluster-init.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; One-shot: waits for the local server and the agent, then registers the service
; with PMM and drops the credentials file the SEP payloads read. autorestart is
; true because every step is idempotent and the useful failure mode is "keep
; trying until pmm-server is up", not "give up".
[program:register]
command=/srv/scripts/register.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
