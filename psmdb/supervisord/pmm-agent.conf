; The one program every sandbox node runs, database or not.
;
; pmm-agent is what makes a container a PMM node, and from pmm-client >= 3.2.0 it
; brings a Nomad *client* with it as a supervised child - which is what makes the
; same container a SEP execution host. A pmm-client-only node (WITH_PSMDB=0 in the
; Dockerfile) is exactly this file and nothing else.
;
; Declared here rather than in each of psmdb.conf/client.conf so the two builds
; cannot drift apart on the piece they have in common. supervisord's conf.d is a
; glob (/etc/supervisor/supervisord.conf carries the [include]), so the process
; table is the union of whatever the Dockerfile copied in.
;
; The unix socket is left at its default so `supervisorctl` works over `docker
; exec` and, more to the point, from a Nomad allocation running on this node.

[program:pmm-agent]
command=/srv/scripts/run-pmm-agent.sh
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
