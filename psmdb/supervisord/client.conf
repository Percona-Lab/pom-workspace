; The whole difference between a pmm-client-only node's process table and a
; database node's - copied in when the image is built WITH_PSMDB=0.
;
; There is no mongod to supervise, no pbm-agent, and no cluster to initiate, so
; all that is left is answering "is this host usable yet?" the same way a database
; node answers it: one marker file, published once pmm-agent has connected. Both
; kinds of node therefore look identical to `./om start`, which is the point -
; readiness is about SEP being able to dispatch here, not about a database.

[program:register-client]
command=/srv/scripts/register-client.sh
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
