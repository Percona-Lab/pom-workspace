# Standalone PMM + SEP + OpenManager stack: one PMM server, the app-restricted
# SEP side-car, and six bare pmm-client hosts (3 Ubuntu, 3 Rocky) for
# om_bootstrap to dispatch MongoDB replica-set bootstrap runs against.
#
# Every image is public and pre-built - nothing here needs a checkout of this
# repo to run, only this file (or this directory, for ./start.sh). See
# README.md for bring-up: PMM_EXTENSIONS_TOKEN below is a placeholder start.sh
# replaces after the first boot mints PMM's secrets, so `docker compose up`
# alone will not wire OpenManager's probe correctly.
#
# Mirrors SEP/sidecar/pmm-fb/compose.yaml's pmm-server + sep-sidecar pairing
# (the shipped PMM+SEP integration) plus psmdb/compose.yaml's client-node
# anchors (bare pmm-client hosts) - rendered into one self-contained file
# rather than referencing either, so it stays usable on its own.

name: om-demo

services:
  pmm-server:
    # Feature build of percona/pmm's PMM-15299-open-manager at 0bcc5f13c, which
    # is what the workspace pins its pmm submodule to - so for the first time in
    # a while the image and the checkout are the same code. It provisions the
    # pmm_extensions role and database, proxies `location /extensions/`, and
    # carries all eight merged OM chains: the Settings flag (#5866), nav gating
    # (#5853), the service gate (#5888), the paginated envelope (#5921), the
    # token log fix (#5995) and the whole bootstrap chain (#5949, #5950, #5951).
    #
    # Matched pair with the side-car below; neither half works against a
    # pre-rename counterpart, and OM in particular is split across the two -
    # pmm-managed holds the topology half and reads the side-car's om_inventory.
    #
    # The tag's sha is the pmm-submodules commit that triggered the build, not a
    # percona/pmm commit. An earlier version of this note claimed 3c88545 "no
    # longer resolves on either remote", which was wrong in a way worth naming:
    # it was looked up in the pmm repo, where it never existed. `git log` it in
    # pmm-submodules instead, and read ci.yml there for what a build pinned.
    #
    # That ci.yml also explains why this build comes off a fork of the branch
    # rather than percona/pmm: ci.py refuses a dependency branch whose open PR
    # is dirty, and #5872 conflicts on one line of api/Makefile. Same tree
    # either way.
    #
    # OM is still off until PMM_ENABLE_OM or the Configuration toggle turns it
    # on - the image having the code is not the feature being enabled.
    image: docker.io/perconalab/pmm-server-fb:${PMM_FB_TAG:-PR-4571-2f183d5}
    environment:
      PMM_ENABLE_EXTENSIONS: "1"
      PMM_EXTENSIONS_ADDRESS: sep-sidecar:9000
      PMM_ENABLE_NOMAD: "1" # SEP task execution runs through PMM's embedded Nomad...
      PMM_PUBLIC_ADDRESS: pmm-server # ...which refuses to start without a public address
      # Wires pmm-managed's own OpenManager probe/bootstrap client (distinct
      # from PMM_EXTENSIONS_ADDRESS above, which only points PMM's nginx proxy at
      # the side-car). PMM_EXTENSIONS_TOKEN must equal SEP's derived
      # EXTENSIONS_INTERNAL_TOKEN - HMAC-SHA256 of the SECRET_KEY PMM mints into the
      # pmm-extensions volume below, label b"extensions-internal-token". That key does not
      # exist until pmm-server's first boot, so start.sh brings this
      # container up once, reads the minted key back out, computes the
      # token, and recreates pmm-server with it - `docker compose up` alone
      # leaves this placeholder in place and OpenManager's enable toggle
      # fails "not available in SEP".
      PMM_EXTENSIONS_URL: http://sep-sidecar:9000
      PMM_EXTENSIONS_TOKEN: "${PMM_EXTENSIONS_TOKEN:-@pmm-extensions-token}"
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - pmm-data:/srv
      - pmm-extensions:/srv/extensions
    networks: [om-demo]

    # The image's own probe with a start period that matches a cold boot.
    #
    # Without this the stack cannot start from empty at all. The image allows
    # 25s before failures count, then 3 at 4s apart, so a first boot - where the
    # entrypoint provisions PostgreSQL, Grafana, VictoriaMetrics and ClickHouse
    # before readyz answers - is declared unhealthy at roughly 40 seconds, every
    # time, on exactly the run where nothing is wrong. `up --wait` gives up the
    # instant that happens, so sep-sidecar never starts and start.sh exits with
    # "dependency failed to start"; PMM then goes healthy about a minute later,
    # untouched, with readyz already answering 200.
    #
    # Measured here on 2026-09-24: unhealthy at 18:44:22, readyz 200 at 18:44:49,
    # healthy at 18:45:09.
    #
    # 240s covers it with room to spare, and is the same figure
    # harness/pmm-compose.override.yml carries for the dev stack - this file was
    # rendered standalone and never picked up that fix. Failures after the
    # period still mark the container unhealthy in the usual way: the probe is
    # unchanged, only the grace before it counts.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/v1/server/readyz"]
      interval: 4s
      timeout: 2s
      retries: 3
      start_period: 240s

  sep-sidecar:
    # Built from the workspace's SEP pin, so the tag is that commit: PMM
    # Extensions main plus the four open PRs #1613 (om_inventory dispatch
    # fixes), #1619 (start_service restart), #1624 (the Nomad dispatch path off
    # the event loop) and #1625 (the dispatch lock's connection use). PMM
    # Extensions publishes no side-car image - its CI only builds
    # extensions:builder for tests - so this is a local build in a personal
    # registry.
    #
    # Matched pair with pmm-server above, and the pairing is what matters here
    # rather than either tag: #1624 is the async Nomad port, and the PMM side
    # reads om_inventory over that path. A side-car older than #1624's session
    # fix answers 500 to every dispatch and an inventory sweep fails on all its
    # hosts, which is what the previous tag would have done had it carried the
    # port. It predated it, so it was merely old rather than broken.
    #
    # Rebuild with, from the SEP checkout at the pinned commit:
    #   docker build -t localhost/extensions:builder -f Containerfile.base .
    #   make pack
    #   docker build -f sidecar/Containerfile.sidecar \
    #     --build-arg EXTENSIONS_RESTRICT_APPS=1 -t <tag> .
    # then `sidecar/verify_image_apps.sh <tag> restricted`, which asserts the
    # app set survived the strip. om_inventory and om_bootstrap are in
    # sidecar/settings.yaml's EXTENSIONS.APPS and would otherwise be deleted
    # from the image. make image itself needs buildah and podman, which this box
    # does not have; docker keeps the HEALTHCHECK that the buildah flags exist
    # to preserve.
    #
    # `make pack` archives a *committed ref*, so uncommitted work in the SEP
    # checkout is invisible to the image while sidecar/ and alembic.ini come
    # from the working tree. Two sources of truth in one build.
    image: ghcr.io/plebioda/sep:integration-271386485
    depends_on:
      pmm-server:
        condition: service_healthy
    # The image runs as uid/gid 1001; PMM writes its secret files 0640 group 0
    # under a setgid directory, so group 0 membership is what makes them
    # readable.
    group_add: ["0"]
    environment:
      SECRETS_DIR: /run/secrets/extensions
      EXTENSIONS_NOMAD_ENDPOINT: https://admin:admin@pmm-server:8443/nomad
      BASE_URL: http://sep-sidecar:9000/extensions
      # Testing-only: speeds up PMMSyncer's pull of PMM's node/service
      # inventory into SEP from the baked profile's 15-minute default.
      # INVENTORY_SYNC_INTERVAL is read once at startup, not
      # runtime-overridable, so this has to be an env var.
      TASKS__INVENTORY_SYNC_INTERVAL__EVERY: "${SEP_INVENTORY_SYNC_MINUTES:-1}"
      TASKS__INVENTORY_SYNC_INTERVAL__PERIOD: minutes
    ports:
      - "127.0.0.1:9000:9000" # sep API
      - "127.0.0.1:9001:9001" # inventory API
      - "127.0.0.1:9002:9002" # tasks API
    volumes:
      - pmm-extensions:/run/secrets/extensions:ro
    networks: [om-demo]

  # ── bare pmm-client hosts: no database, just PMM + Nomad agent ────────────
  # om_bootstrap dispatches its MongoDB replica-set bootstrap payload onto
  # these. Real systemd as PID 1 (systemctl enable/start mongod.service is
  # part of the payload).
  #
  # Tagged after the same feature build as pmm-server, and that is a real
  # constraint rather than a naming habit. psmdb/Dockerfile overlays
  # tools/nomad from the FB client image over the released package, so this tag
  # decides the Nomad *client* version while pmm-server decides the Nomad
  # *server*. The previous build was v2.0.5 on both sides; this one is v2.0.7 on
  # both. OM's whole dispatch path is Nomad - om_inventory sweeps and
  # om_bootstrap runs are Nomad jobs landing on these hosts - so a skew here
  # surfaces as hosts unreachable, which looks like the app's fault.
  #
  # Rebuild both, from psmdb/, with the tag pmm-server uses:
  #   docker build --build-arg WITH_PSMDB=0 --build-arg BASE_OS=ubuntu \
  #     --build-arg PMM_CLIENT_FB_IMAGE=docker.io/perconalab/pmm-client-fb:<tag> \
  #     -t ghcr.io/plebioda/pmm-client-node:<tag> .
  # and again with BASE_OS=rocky. Check `tools/nomad version` in the result
  # against the server image before pinning it here.
  #
  # psmdb/Dockerfile's own default stays on the older build on purpose: it is
  # what ./om's dev loop builds from, and that stack's pmm-server is still
  # v2.0.5. Bumping the default would fix this pairing and break that one.
  pmm-client-node00: &client-node
    image: ghcr.io/plebioda/pmm-client-node:pr-4571-2f183d5
    restart: unless-stopped
    networks: [om-demo]
    cgroup: host
    cap_add: [SYS_ADMIN]
    security_opt: [apparmor:unconfined, seccomp:unconfined]
    tmpfs: [/run, /run/lock]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - agent-state:/srv/agent-state
    environment:
      ROLE: client
      PMM_SERVER: pmm-server:8443
      PMM_USER: admin
      PMM_PASSWORD: admin
    hostname: pmm-client-node00

  pmm-client-node01:
    <<: *client-node
    hostname: pmm-client-node01

  pmm-client-node02:
    <<: *client-node
    hostname: pmm-client-node02

  pmm-client-rocky-node00:
    <<: *client-node
    image: ghcr.io/plebioda/pmm-client-node-rocky:pr-4571-2f183d5
    hostname: pmm-client-rocky-node00

  pmm-client-rocky-node01:
    <<: *client-node
    image: ghcr.io/plebioda/pmm-client-node-rocky:pr-4571-2f183d5
    hostname: pmm-client-rocky-node01

  pmm-client-rocky-node02:
    <<: *client-node
    image: ghcr.io/plebioda/pmm-client-node-rocky:pr-4571-2f183d5
    hostname: pmm-client-rocky-node02

networks:
  om-demo:
    driver: bridge

volumes:
  pmm-data:
  pmm-extensions:
  agent-state:
