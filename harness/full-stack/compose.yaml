# Standalone PMM + SEP + OpenManager stack: one PMM server, the app-restricted
# SEP side-car, and six bare pmm-client hosts (3 Ubuntu, 3 Rocky) for
# om_bootstrap to dispatch MongoDB replica-set bootstrap runs against.
#
# Every image is public and pre-built - nothing here needs a checkout of this
# repo to run, only this file (or this directory, for ./start.sh). See
# README.md for bring-up: PMM_EXTENSIONS_TOKEN below is a placeholder start.sh
# replaces after the first boot mints PMM's secrets, so `docker compose up`
# alone will not wire OpenManager's probe correctly.
#
# Mirrors SEP/sidecar/pmm-fb/compose.yaml's pmm-server + sep-sidecar pairing
# (the shipped PMM+SEP integration) plus psmdb/compose.yaml's client-node
# anchors (bare pmm-client hosts) - rendered into one self-contained file
# rather than referencing either, so it stays usable on its own.

name: om-demo

services:
  pmm-server:
    # The first feature build off the post-rename bundle (percona/pmm
    # PMM-15347-om-integration-v3 at 747f92d40), so it provisions the
    # pmm_extensions role and database and proxies `location /extensions/`.
    # Matched pair with the side-car below; neither half works against a
    # pre-rename counterpart.
    #
    # Lags the submodule, and by more than it used to. The pin is now
    # PMM-15299-open-manager's tip, which carries all five of the OM stack's
    # merged PRs: the service gate (#5888), the bearer-token log fix (#5995),
    # and the whole bootstrap chain (#5949, #5950, #5951).
    #
    # This tag has not been rebuilt since before PMM-15360's startup reconcile
    # retry landed, so it still has the one-shot version: a cold start here can
    # leave OpenManager enabled in PMM and off in the side-car until
    # pmm-managed restarts. Everything merged after that, the bootstrap backend
    # and its UI included, is absent from the image too.
    #
    # The exact delta cannot be read off the history: the tag's own source
    # commit (3c88545) no longer resolves in this repo or on either remote, so
    # treat the image as predating the stack rather than trying to diff it.
    # Rebuild the feature build and bump PMM_FB_TAG to exercise any of it end
    # to end.
    image: docker.io/perconalab/pmm-server-fb:${PMM_FB_TAG:-PR-4571-3c88545}
    environment:
      PMM_ENABLE_EXTENSIONS: "1"
      PMM_EXTENSIONS_ADDRESS: sep-sidecar:9000
      PMM_ENABLE_NOMAD: "1" # SEP task execution runs through PMM's embedded Nomad...
      PMM_PUBLIC_ADDRESS: pmm-server # ...which refuses to start without a public address
      # Wires pmm-managed's own OpenManager probe/bootstrap client (distinct
      # from PMM_EXTENSIONS_ADDRESS above, which only points PMM's nginx proxy at
      # the side-car). PMM_EXTENSIONS_TOKEN must equal SEP's derived
      # EXTENSIONS_INTERNAL_TOKEN - HMAC-SHA256 of the SECRET_KEY PMM mints into the
      # pmm-extensions volume below, label b"extensions-internal-token". That key does not
      # exist until pmm-server's first boot, so start.sh brings this
      # container up once, reads the minted key back out, computes the
      # token, and recreates pmm-server with it - `docker compose up` alone
      # leaves this placeholder in place and OpenManager's enable toggle
      # fails "not available in SEP".
      PMM_EXTENSIONS_URL: http://sep-sidecar:9000
      PMM_EXTENSIONS_TOKEN: "${PMM_EXTENSIONS_TOKEN:-@pmm-extensions-token}"
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - pmm-data:/srv
      - pmm-extensions:/srv/extensions
    networks: [om-demo]

    # The image's own probe with a start period that matches a cold boot.
    #
    # Without this the stack cannot start from empty at all. The image allows
    # 25s before failures count, then 3 at 4s apart, so a first boot - where the
    # entrypoint provisions PostgreSQL, Grafana, VictoriaMetrics and ClickHouse
    # before readyz answers - is declared unhealthy at roughly 40 seconds, every
    # time, on exactly the run where nothing is wrong. `up --wait` gives up the
    # instant that happens, so sep-sidecar never starts and start.sh exits with
    # "dependency failed to start"; PMM then goes healthy about a minute later,
    # untouched, with readyz already answering 200.
    #
    # Measured here on 2026-09-24: unhealthy at 18:44:22, readyz 200 at 18:44:49,
    # healthy at 18:45:09.
    #
    # 240s covers it with room to spare, and is the same figure
    # harness/pmm-compose.override.yml carries for the dev stack - this file was
    # rendered standalone and never picked up that fix. Failures after the
    # period still mark the container unhealthy in the usual way: the probe is
    # unchanged, only the grace before it counts.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/v1/server/readyz"]
      interval: 4s
      timeout: 2s
      retries: 3
      start_period: 240s

  sep-sidecar:
    # SEP's main plus the two open PRs #1613 (om_inventory dispatch fixes) and
    # #1619 (start_service restart), tagged by that build's commit. SEP
    # publishes no side-car image - its CI only builds sep:builder for tests -
    # so this is a local build in a personal registry.
    #
    # No longer the submodule's pin, and the note that said it was is what this
    # replaces. The submodule now carries two further PRs this tag predates:
    # #1624, which takes the Nomad dispatch path off the event loop, and #1625,
    # which stops a dispatch lock's own bookkeeping failing the dispatch.
    #
    # That makes the gap worth stating rather than just recording. #1624 also
    # carries the fix for the regression it shipped with, where every
    # request-less caller reached for an aiohttp session nothing had opened and
    # the dispatch answered 500 - an om_inventory sweep failed on all 14 hosts.
    # This tag is old enough to have neither, so it is unaffected; a rebuild
    # onto anything between that port and its fix would not be. Rebuild from
    # the submodule's commit to exercise either PR here.
    image: ghcr.io/plebioda/sep:integration-f786f7558
    depends_on:
      pmm-server:
        condition: service_healthy
    # The image runs as uid/gid 1001; PMM writes its secret files 0640 group 0
    # under a setgid directory, so group 0 membership is what makes them
    # readable.
    group_add: ["0"]
    environment:
      SECRETS_DIR: /run/secrets/extensions
      EXTENSIONS_NOMAD_ENDPOINT: https://admin:admin@pmm-server:8443/nomad
      BASE_URL: http://sep-sidecar:9000/extensions
      # Testing-only: speeds up PMMSyncer's pull of PMM's node/service
      # inventory into SEP from the baked profile's 15-minute default.
      # INVENTORY_SYNC_INTERVAL is read once at startup, not
      # runtime-overridable, so this has to be an env var.
      TASKS__INVENTORY_SYNC_INTERVAL__EVERY: "${SEP_INVENTORY_SYNC_MINUTES:-1}"
      TASKS__INVENTORY_SYNC_INTERVAL__PERIOD: minutes
    ports:
      - "127.0.0.1:9000:9000" # sep API
      - "127.0.0.1:9001:9001" # inventory API
      - "127.0.0.1:9002:9002" # tasks API
    volumes:
      - pmm-extensions:/run/secrets/extensions:ro
    networks: [om-demo]

  # ── bare pmm-client hosts: no database, just PMM + Nomad agent ────────────
  # om_bootstrap dispatches its MongoDB replica-set bootstrap payload onto
  # these. Real systemd as PID 1 (systemctl enable/start mongod.service is
  # part of the payload).
  pmm-client-node00: &client-node
    image: ghcr.io/plebioda/pmm-client-node:pr-4571-3c88545
    restart: unless-stopped
    networks: [om-demo]
    cgroup: host
    cap_add: [SYS_ADMIN]
    security_opt: [apparmor:unconfined, seccomp:unconfined]
    tmpfs: [/run, /run/lock]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - agent-state:/srv/agent-state
    environment:
      ROLE: client
      PMM_SERVER: pmm-server:8443
      PMM_USER: admin
      PMM_PASSWORD: admin
    hostname: pmm-client-node00

  pmm-client-node01:
    <<: *client-node
    hostname: pmm-client-node01

  pmm-client-node02:
    <<: *client-node
    hostname: pmm-client-node02

  pmm-client-rocky-node00:
    <<: *client-node
    image: ghcr.io/plebioda/pmm-client-node-rocky:pr-4571-3c88545
    hostname: pmm-client-rocky-node00

  pmm-client-rocky-node01:
    <<: *client-node
    image: ghcr.io/plebioda/pmm-client-node-rocky:pr-4571-3c88545
    hostname: pmm-client-rocky-node01

  pmm-client-rocky-node02:
    <<: *client-node
    image: ghcr.io/plebioda/pmm-client-node-rocky:pr-4571-3c88545
    hostname: pmm-client-rocky-node02

networks:
  om-demo:
    driver: bridge

volumes:
  pmm-data:
  pmm-extensions:
  agent-state:
