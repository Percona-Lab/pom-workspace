# Development overrides for a SEP running natively against PMM's embedded stack.
#
# `./om` deep-merges this into SEP's own settings.yaml and writes the result to
# harness/sep-settings.yaml (gitignored), then points SEP at it with SETTINGS_FILE.
# So the SEP checkout keeps upstream's settings.yaml untouched and this workspace
# carries its own configuration -- the same split as harness/pmm-compose.override.yml.
#
# Everything here except the casdoor drop could equally be `EXTENSIONS__`-prefixed
# variables in SEP/.env. The drop cannot: AUTH__PROVIDER__CASDOOR=null arrives as
# the *string* "null" and fails validation, because pydantic-settings does not
# coerce it. Only YAML can express the None that AuthSettings._resolve_provider
# step 2 looks for. That single line is why this file exists rather than a dotenv.
#
# The equivalent for the shipped image is SEP's own sidecar/settings.embedded.yaml:
# same settings, container hostnames instead of 127.0.0.1, and no casdoor to drop
# because that profile is a single `default:` block whose only provider is grafana.
# Nothing here is needed for a CI-built image.

development:
  PMM:
    ANNOTATIONS_ENABLED: true

  INVENTORY:
    DATABASE: &pmm_embedded_db
      # PMM's embedded PostgreSQL, exposed by PMM_ENABLE_EXTENSIONS (percona/pmm#5700).
      # All three services and the Celery beat store share the one `pmm_extensions` database
      # the exposure provisions; the Alembic tracks use distinct version tables.
      # PASSWORD comes from .env (EXTENSIONS__/INVENTORY__/TASKS__DATABASE__PASSWORD).
      ENGINE: postgresql
      HOST: 127.0.0.1
      PORT: 5432
      NAME: pmm_extensions
      USER: pmm_extensions
      # This block replaces SEP's own settings.yaml DATABASE entirely rather than
      # merging into it (it is a plain mapping under a profile, not a
      # dynaconf_merge one), so OM's schema token has to be re-declared here too
      # or SEP's engine falls back to the class default (`{}`) and every query
      # against `om.host`/`om.service`/`om.inventory_run` reaches Postgres as the
      # literal, undefined schema `om_schema`. Keep in sync with SEP/settings.yaml
      # and SEP/sidecar/settings.yaml's equivalent entries.
      SCHEMA_TRANSLATE_MAP:
        om_schema: om
    # Matches sidecar/settings.yaml's embedded-profile default (SEP-1860):
    # a full multi-syncer collection once a day, on top of the more frequent
    # PMM-only sync below.
    COLLECTION_INTERVAL: 1 days

  TASKS:
    DATABASE: *pmm_embedded_db
    NOMAD:
      # PMM's embedded Nomad, reached through nginx. That location keeps
      # auth_request on, so the credentials ride in the URL - python-nomad has no
      # setting for a Basic/Bearer header of its own.
      ENDPOINT: https://admin:admin@127.0.0.1:8443/nomad
      SECURE: true
      VERIFY_SSL: false
    # Shorter than the shipped embedded-profile default (15 minutes, see
    # sidecar/settings.yaml / SEP-1860) so PMM's inventory copy stays fresh
    # while iterating locally. A real sync run can take close to a minute to
    # fully settle (see SyncInstanceManager), so back-to-back firings can
    # occasionally collide with SyncInstanceAlreadyInProgressError and get
    # skipped -- the next firing a minute later picks it back up.
    INVENTORY_SYNC_INTERVAL: 1 minutes

  EXTENSIONS:
    DATABASE: *pmm_embedded_db
    # Matches sidecar/settings.yaml, and for the same reason it gives there: PMM
    # ships a hardcoded `location /extensions/` and forwards the prefix intact, so SEP
    # has to be mounted under it. The harness used to strip the prefix in its own
    # nginx fragment instead, because ROOT_PATH did not exist when that was
    # written (SEP-1794); it does now, so the fragment is gone and this matches
    # what ships. Requests that arrive unprefixed still route - which is what lets
    # pmm-managed keep calling PMM_EXTENSIONS_URL directly, exactly as the side-car
    # topology does with the side-car on :9000.
    ROOT_PATH: /extensions
    # Sign in an unauthenticated caller from the ambient PMM session - the other
    # half of PMM-15293's /api/oauth/session/exchange.
    AMBIENT_SESSION_SSO_ENABLED: true
    OM_INVENTORY:
      # ENABLED defaults to False in the product (percona/sep#1437) to match PMM's
      # own OMEnabledDefault: pmm-managed's ChangeSettings is what flips it, on the
      # PMM-15360-om-service-gate companion (percona/pmm#5888). Since the pmm pin
      # moved to the PR stack that switch IS present, so this only seeds the sweep
      # as on before anyone touches Settings; PMM overwrites it either way.
      # Testing convenience only - never change #1437's own shipped default for this.
      ENABLED: true
    # The default 127.0.0.1 is unreachable from the PMM container, which proxies
    # /sep to host.docker.internal. Same exposure as the PMM devcontainer's own
    # published 8443 - a dev box, not a shared host.
    UVICORN_HOST: "0.0.0.0"

  AUTH:
    PROVIDER:
      # Auth has exactly one active provider. `null` drops the entry the default
      # block merged in (AuthSettings._resolve_provider step 2) so Grafana is the
      # only one left - the PMM session is the identity here, not Casdoor.
      casdoor: null
      grafana:
        endpoint: https://127.0.0.1:8443/graph
        session_cookie_name: pmm_session
        verify_ssl: false
        # service_account_token comes from .env

  CELERY:
    # Beat schedule lives in the same `pmm_extensions` database; overridden with the password
    # from .env as CELERY__BEAT_DBURI.
    BEAT_DBURI: "postgresql://pmm_extensions@127.0.0.1:5432/pmm_extensions"

    # Valkey, the same broker and the same two database numbers the shipped
    # side-car uses (sidecar/settings.yaml: redis://127.0.0.1:6379/0 and /1,
    # served by its bundled [program:valkey]). Supplied here as a container
    # rather than a supervisord program because SEP runs natively in this
    # workspace; harness/pmm-compose.override.yml starts it.
    #
    # This overrides SEP's own `development:` default of filesystem://, which
    # is not crash-safe and took the worker down on 2026-09-24. Kombu's
    # filesystem transport reads a message file that a concurrent producer has
    # created but not yet written, gets a zero-length payload, and raises
    # JSONDecodeError out of drain_events - which Celery classes unrecoverable
    # and stops consuming on. Nothing restarts it and nothing says so: beat
    # keeps dispatching, so celery_periodictask.last_run_at goes on advancing
    # into a queue with no reader. Observed as 133 unconsumed messages and a
    # bootstrap run stuck on install_package for half an hour, with the
    # packages in fact installed and every Nomad allocation complete.
    BROKER_URL: "redis://127.0.0.1:6379/0"
    RESULT_BACKEND: "redis://127.0.0.1:6379/1"
    # Only the filesystem transport reads these, and an explicit null drops the
    # block that SEP's development profile merged in rather than leaving four
    # dead paths pointing at data/celery/.
    BROKER_TRANSPORT_OPTIONS: null
