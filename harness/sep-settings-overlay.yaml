# Development overrides for a SEP running natively against PMM's embedded stack.
#
# `./om` deep-merges this into SEP's own settings.yaml and writes the result to
# harness/sep-settings.yaml (gitignored), then points SEP at it with SETTINGS_FILE.
# So the SEP checkout keeps upstream's settings.yaml untouched and this workspace
# carries its own configuration -- the same split as harness/pmm.conf.
#
# Everything here except the casdoor drop could equally be `SEP__`-prefixed
# variables in SEP/.env. The drop cannot: AUTH__PROVIDER__CASDOOR=null arrives as
# the *string* "null" and fails validation, because pydantic-settings does not
# coerce it. Only YAML can express the None that AuthSettings._resolve_provider
# step 2 looks for. That single line is why this file exists rather than a dotenv.
#
# The equivalent for the shipped image is SEP's own sidecar/settings.embedded.yaml:
# same settings, container hostnames instead of 127.0.0.1, and no casdoor to drop
# because that profile is a single `default:` block whose only provider is grafana.
# Nothing here is needed for a CI-built image.

development:
  PMM:
    ANNOTATIONS_ENABLED: true

  INVENTORY:
    DATABASE: &pmm_embedded_db
      # PMM's embedded PostgreSQL, exposed by PMM_ENABLE_SEP (percona/pmm#5700).
      # All three services and the Celery beat store share the one `sep` database
      # the exposure provisions; the Alembic tracks use distinct version tables.
      # PASSWORD comes from .env (SEP__/INVENTORY__/TASKS__DATABASE__PASSWORD).
      ENGINE: postgresql
      HOST: 127.0.0.1
      PORT: 5432
      NAME: sep
      USER: sep
    # Matches sidecar/settings.yaml's embedded-profile default (SEP-1860):
    # a full multi-syncer collection once a day, on top of the more frequent
    # PMM-only sync below.
    COLLECTION_INTERVAL: 1 days

  TASKS:
    DATABASE: *pmm_embedded_db
    NOMAD:
      # PMM's embedded Nomad, reached through nginx. That location keeps
      # auth_request on, so the credentials ride in the URL - python-nomad has no
      # setting for a Basic/Bearer header of its own.
      ENDPOINT: https://admin:admin@127.0.0.1:8443/nomad
      SECURE: true
      VERIFY_SSL: false
    # Shorter than the shipped embedded-profile default (15 minutes, see
    # sidecar/settings.yaml / SEP-1860) so PMM's inventory copy stays fresh
    # while iterating locally. A real sync run can take close to a minute to
    # fully settle (see SyncInstanceManager), so back-to-back firings can
    # occasionally collide with SyncInstanceAlreadyInProgressError and get
    # skipped -- the next firing a minute later picks it back up.
    INVENTORY_SYNC_INTERVAL: 1 minutes

  SEP:
    DATABASE: *pmm_embedded_db
    # Sign in an unauthenticated caller from the ambient PMM session - the other
    # half of PMM-15293's /api/oauth/session/exchange.
    AMBIENT_SESSION_SSO_ENABLED: true
    # The default 127.0.0.1 is unreachable from the PMM container, which proxies
    # /sep to host.docker.internal. Same exposure as the PMM devcontainer's own
    # published 8443 - a dev box, not a shared host.
    UVICORN_HOST: "0.0.0.0"

  AUTH:
    PROVIDER:
      # Auth has exactly one active provider. `null` drops the entry the default
      # block merged in (AuthSettings._resolve_provider step 2) so Grafana is the
      # only one left - the PMM session is the identity here, not Casdoor.
      casdoor: null
      grafana:
        endpoint: https://127.0.0.1:8443/graph
        session_cookie_name: pmm_session
        verify_ssl: false
        # service_account_token comes from .env

  CELERY:
    # Beat schedule lives in the same `sep` database; overridden with the password
    # from .env as CELERY__BEAT_DBURI.
    BEAT_DBURI: "postgresql://sep@127.0.0.1:5432/sep"
