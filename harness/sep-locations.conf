# SEP locations for pmm-server's nginx, injected into PMM's own pmm.conf by
# `./om start pmm` (see render_pmm_conf in om). Kept here rather than in the pmm
# repo on purpose: PMM upstream carries no SEP awareness in its nginx config,
# and the shipped integration supplies its own overlay the same way -- SEP's
# sidecar/pmm-fb/bootstrap.sh renders a pmm.conf and mounts it over PMM's copy.
# This harness does the same thing, differing only in where SEP runs.
#
# Rendered against pmm's current pmm.conf on every start rather than snapshotted,
# so PMM's other locations cannot go stale here the way they have in SEP's
# committed template (390 lines, pinned to the PR-4500 feature build).
#
# The upstream template proxies to the SEP sidecar container at 172.28.9.30:9000
# and injects a bearer token. This one reaches SEP running natively on the host
# and injects nothing: the browser mints its own token from the PMM session
# (PMM-15293), which is the direction that replaces the interim injection.

    # SEP backend, local dev only.
    # One mount point, mirroring the shipped topology the SEP client already
    # assumes: SEP_BASE_PATH in ui/packages/sep/api/src/base.ts prefixes every
    # request with /sep, so the browser calls /sep/api/..., /sep/files/... and
    # so on.
    # It sits outside PMM's /v1 and /graph namespaces, so nothing here shadows a
    # PMM route.
    #
    # The prefix is stripped, by the trailing slash on proxy_pass, because this
    # SEP does not serve it: SEP-1794's SEP.ROOT_PATH is not in this SEP branch
    # and FastAPI is constructed without root_path. That is the same trade the
    # vite dev proxy makes with PMM_DEV_SEP_STRIP_PREFIX=1, and it is lossy in
    # the same way - request.url_for() then emits prefix-less absolute URLs
    # inside payloads, so a link SEP hands back escapes the mount point. Drop the
    # strip and forward /sep untouched once SEP carries ROOT_PATH.
    #
    # Upstream is SEP run natively on the host (make dev-backend, 127.0.0.1:8000),
    # reached through the host-gateway alias declared in docker-compose.dev.yml.
    # pmm-managed (PMM_SEP_URL) and ./om call that port directly and never pass
    # through here, so this location serves the browser alone.
    #
    # No bearer is injected. On PMM-15293 the browser mints its own short-lived
    # SEP token by POSTing /api/oauth/session/exchange, which is same-origin
    # through this proxy and so carries the pmm_session cookie; SEP validates it
    # against Grafana and maps the org role. Injecting a token here would instead
    # authenticate everything as SEP's internal service principal, which hardcodes
    # is_admin = False — exactly the 403s PMM-15293 exists to remove.
    #
    # auth_request is off because SEP authenticates the request itself. That means
    # anything able to reach this port can call the SEP API: local testing only.
    location /sep/ {
      auth_request off;
      proxy_pass http://host.docker.internal:8000/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 600;
    }
    # Streaming endpoints: long-lived, unbuffered, WebSocket-capable. Longer
    # prefixes than /sep/, so nginx matches these first.
    location /sep/stream-logs {
      auth_request off;
      proxy_pass http://host.docker.internal:8000/stream-logs;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }
    location /sep/execution-events {
      auth_request off;
      proxy_pass http://host.docker.internal:8000/execution-events;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600;
    }

