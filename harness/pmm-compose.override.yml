# Compose overlay for pmm/docker-compose.dev.yml, applied by `./om start pmm`.
#
# Everything the workspace needs from the PMM container that PMM itself has no
# reason to carry, plus the one side service a natively-run SEP cannot supply
# itself. Keeping it here means the pmm checkout stays a clean branch of OM code:
# the workspace supplies its own overlay rather than patching PMM's files.
#
# It deliberately does not supply its own nginx config. PMM owns `location /extensions/`
# (percona/pmm#5884) and SEP is built to be served under it - "PMM ships a
# hardcoded location /extensions/ block, so this is fixed topology rather than a
# per-deployment input", SEP/sidecar/settings.yaml. So the only thing this
# workspace varies is PMM_EXTENSIONS_ADDRESS, which is the input PMM exposes for it.
#
# Relative paths resolve against the project directory, which is pmm/ because om
# passes pmm/docker-compose.dev.yml first and runs compose from there.

services:
  pmm-server:
    # Lets the SEP locations reach a SEP backend running natively on the host
    # (./om start sep-backend). Implicit on Docker Desktop, explicit on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Same probe as the image, with a start period that matches a cold start.
    #
    # The image allows 25s before failures start counting, then 3 failures at 4s
    # apart. On an existing /srv that is ample. On an empty one it is not close:
    # the entrypoint provisions PostgreSQL, Grafana, VictoriaMetrics and
    # ClickHouse first, and readyz answers about two minutes in. So the container
    # is declared unhealthy at roughly 40 seconds, every time, on exactly the run
    # where nothing is wrong.
    #
    # That is worse than a slow start because `docker compose up --wait` aborts
    # the moment a container turns unhealthy - it does not wait out
    # --wait-timeout. `./om start pmm` therefore failed after ~40s while claiming
    # 300s had elapsed, and the container went healthy a minute later untouched.
    #
    # 240s is the cold-start figure with room to spare. Failures after it still
    # mark the container unhealthy in the usual way, so nothing is being papered
    # over - the probe is unchanged, only the grace before it counts.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/v1/server/readyz"]
      interval: 4s
      timeout: 2s
      retries: 3
      start_period: 240s

    volumes:
      # The SEP integration's server-side half, mounted from the checkout because
      # PMM_SERVER_IMAGE is a published perconalab/pmm-server older than the
      # branch. It runs the *image's* /opt/entrypoint.sh, under which
      # PMM_ENABLE_EXTENSIONS is a silent no-op, so the branch's entrypoint has to be
      # mounted over it - and then every helper that entrypoint calls has to be
      # mounted too, or it aborts under `set -o errexit` on the first one missing.
      #
      # Nothing here is a workspace-specific config: each file is PMM's own, from
      # the checkout, at the path the image would have baked it. A feature build
      # of the branch carries all five and needs none of these mounts, which is
      # why harness/full-stack/ pins pmm-server-fb rather than the dev image.
      #
      #   entrypoint.sh       the branch's, per above
      #   postgres-extensions        exposes the embedded PostgreSQL (percona/pmm#5700)
      #   postgres-migration  the same PR moved the PG version literals into the
      #                       entrypoint and passes them down as exported
      #                       variables; the image's older copy would abort
      #   extensions.conf.template   the `location /extensions/` block the entrypoint renders
      #                       into /etc/nginx/extensions.d/, which pmm.conf includes
      #                       (percona/pmm#5884). PMM_EXTENSIONS_ADDRESS is the only
      #                       input; see harness/pmm-env.example
      #   extensions-secrets         publishes SEP's SECRET_KEY and DB credentials. The
      #                       entrypoint calls it unconditionally - it owns its
      #                       own PMM_ENABLE_EXTENSIONS gate - so a missing file kills
      #                       the container even with SEP disabled
      - ./build/docker/server/entrypoint.sh:/opt/entrypoint.sh:ro
      - ./build/ansible/roles/postgres/files/postgres-extensions:/opt/ansible/roles/postgres/files/postgres-extensions:ro
      - ./build/ansible/roles/postgres/files/postgres-migration:/opt/ansible/roles/postgres/files/postgres-migration:ro
      - ./build/ansible/roles/nginx/files/extensions/extensions.conf.template:/opt/ansible/roles/nginx/files/extensions/extensions.conf.template:ro
      - ./build/ansible/roles/extensions/files/extensions-secrets:/opt/ansible/roles/extensions/files/extensions-secrets:ro

  # SEP's Celery broker and result backend.
  #
  # The shipped side-car bundles this as [program:valkey] inside its own
  # container and points Celery at redis://127.0.0.1:6379/{0,1}
  # (SEP/sidecar/supervisord.conf, SEP/sidecar/settings.yaml). SEP runs natively
  # here, so it gets the same Valkey as a container instead - same image family
  # the side-car copies its binaries from, same port, same database numbers, so
  # harness/sep-settings-overlay.yaml's URLs are the side-car's verbatim.
  #
  # This replaces SEP's `development:` default of filesystem://, which is not
  # crash-safe: on 2026-09-24 it fed the worker a zero-length message and killed
  # it with an unrecoverable JSONDecodeError, silently, for half an hour. The
  # overlay records the full failure.
  #
  # In the pmm compose project rather than a file of its own because SEP already
  # cannot start without this project - it borrows PMM's PostgreSQL and Nomad -
  # so one lifecycle is one thing to forget rather than two. Published on
  # loopback only: SEP reaches it from the host, and nothing in a container does.
  sep-valkey:
    profiles:
      - pmm
    image: valkey/valkey:8-bookworm
    container_name: sep-valkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    # No volume. Both databases are scratch: the broker is a queue that should be
    # empty at rest, and results expire after RESULT_EXPIRES anyway. Persisting
    # them would only carry a crashed run's backlog into the next start.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
