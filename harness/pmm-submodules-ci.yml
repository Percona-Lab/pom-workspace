# Ready-to-use ci.yml for a PMM feature build carrying OM.
#
# Copy this over ci.yml in a branch of Percona-Lab/pmm-submodules, commit, push, and
# open a draft PR. Pushing to a feature branch is what triggers the Jenkins build.
# https://github.com/Percona-Lab/pmm-submodules#how-to-create-a-feature-build
#
# No `url` line: the branch is pushed to percona/pmm, which is the url .gitmodules already
# gives the `pmm` dependency. Adding `url: https://github.com/<account>/pmm` is what would
# make the build take a fork instead -- the README documents it, and it is verified to work
# with ci.py's merge (it sets repo_url_changed and re-clones), but it is not the route in
# use here.
#
# One entry is enough. PMM-15333-pom-poc is forked off PMM-15293-sep-session-exchange
# and measures 39 commits ahead of percona/pmm main with nothing behind it, so it
# already carries the whole SEP-integration chain -- PMM-15216 and PMM-15293 are both
# ancestors of it -- as well as OM's pmm-managed service and dashboard.
#
# SEP is deliberately absent: it is not a pmm-submodules dependency and no PMM build
# can produce it. Its image is built separately (`make image-sidecar-embedded` in the
# SEP checkout) and paired with this one at run time by sidecar/pmm-fb/compose.yaml.
#
# NOTE ON ACCESS: the FB branch has to live in Percona-Lab/pmm-submodules itself -- every
# one of the last 15 feature-build PRs has its head branch there, none comes from a fork,
# and the fork support above is for the *dependencies*, not for pmm-submodules. As of
# 2026-08-17 this account has `push: true` on both Percona-Lab/pmm-submodules and
# percona/pmm (it did not when this file was written), so no colleague and no further
# access request is needed for either half.
#
# The pmm/ checkout deliberately has no push URL for percona/pmm (`upstream` is set to
# `no-push`), so push the dependency branch by naming the URL:
#   git -C pmm push git@github.com:percona/pmm.git HEAD:refs/heads/PMM-15333-pom-poc
deps:
  - name: pmm
    branch: PMM-15333-pom-poc
